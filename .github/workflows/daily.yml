name: daily-rates
on: {schedule: [{cron: "0 12 * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 && python scraper/scrape.py && python build.py
      - run: git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && (git commit -m "daily rates" || true) && git push
